name: wordlist_elicitation
description: A comparative wordlist elicitation tool for linguistic fieldwork
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Companion Suite core: Dekereke XML codec, task package formats
  # (.dektask/.dekresult), identity, merge. Pure Dart, shared with the
  # future desktop Companion.
  dekereke_core:
    path: packages/dekereke_core

  # State Management
  provider: ^6.1.1
  
  # Data Persistence
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # XML Parsing
  xml: ^6.4.2
  
  # File Operations
  archive: ^3.4.9
  
  # Audio Recording & Playback
  # record 6.x is required: 5.x ships a record_linux that no longer matches
  # record_platform_interface, which breaks the Android release build.
  record: ^6.0.0
  audioplayers: ^5.2.1
  permission_handler: ^11.1.0
  
  # UI Components
  intl: ^0.20.2
  share_plus: ^10.1.2
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  
  # Assets
  # assets:
  #   - assets/images/
  #   - assets/fonts/
  
  # fonts:
  #   - family: CharisSIL
  #     fonts:
  #       - asset: assets/fonts/CharisSIL-Regular.ttf
