name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dekereke-core:
    name: dekereke_core (pure Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dekereke_core
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.4

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

  worker-engine:
    name: dekereke-sync engine (Worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/dekereke-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/dekereke-sync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Builds with esbuild, then runs vitest against Miniflare (real
      # workerd + D1, migration applied from migrations/).
      - name: Run tests
        run: npm test

  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The nested pure-Dart package needs its own resolution, or the
      # repo-wide analyzer pass reports unresolvable imports inside it.
      - name: Resolve packages/dekereke_core
        run: dart pub get
        working-directory: packages/dekereke_core

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Release build signed with debug keys (see android/app/build.gradle.kts),
      # suitable for sideloading onto fieldwork devices.
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordlist-elicitation-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
